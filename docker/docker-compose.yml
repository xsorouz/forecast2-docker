# 🛠️ Version de la syntaxe Docker Compose utilisée
version: '3.8'

# 🏗️ Définition des services qui seront exécutés
services:
  python_app:  # 🔹 Nom du service Python qui exécutera le script de transformation
    
    # 📦 Construction de l'image Docker depuis le `Dockerfile`
    # Le chemin est ajusté pour prendre en compte la structure actuelle du projet
    build: 
      context: ..
      dockerfile: docker/Dockerfile

    # 🏷️ Nom du conteneur Docker (pour mieux l'identifier)
    container_name: python_transform

    # 🌍 Définition des variables d'environnement
    # Ici, on fournit l'URI de connexion à MongoDB Atlas pour que le script Python puisse l'utiliser
    environment:
      - MONGO_URI=mongodb+srv://Sorouz:Sorouz&0512@nimbusdb.glwzm.mongodb.net/weather_db

    # 🔗 Connexion du service à un réseau Docker personnalisé
    # Cela permet aux conteneurs du même réseau de communiquer entre eux
    networks:
      - forecast_network

    # 📂 Montage des fichiers locaux dans le conteneur
    # Ce montage permet d’accéder aux fichiers du projet à l’intérieur du conteneur
    volumes:
      - ../scripts:/app/scripts  # Monte le dossier `scripts/` dans le conteneur
      - ../data:/app/data  # Monte le dossier `data/` dans le conteneur
      - ../logs:/app/logs  # Monte le dossier `logs/` pour stocker les logs

    # 📍 Définition du dossier de travail à l'intérieur du conteneur
    # Tous les fichiers seront exécutés à partir de ce répertoire
    working_dir: /app

    # 🚀 Commande exécutée automatiquement au démarrage du conteneur
    # Ici, on exécute le script de transformation des données en Python
    command: ["python", "/app/scripts/transform_script.py"] 

networks:
  forecast_network:
    driver: bridge  # 🔗 Utilisation du mode "bridge" pour permettre la communication entre conteneurs
